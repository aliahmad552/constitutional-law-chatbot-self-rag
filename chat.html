<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakistan Legal AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,system-ui,sans-serif;
}

body{
height:100vh;
display:flex;
background:#202123;
color:white;
overflow:hidden;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
background:#171717;
display:flex;
flex-direction:column;
border-right:1px solid #2a2a2a;
}

.new-chat{
margin:12px;
padding:12px;
border:1px solid #444;
border-radius:10px;
cursor:pointer;
background:#222;
}

.new-chat:hover{
background:#2b2b2b;
}

.chat-list{
flex:1;
overflow-y:auto;
padding:10px;
}

.chat-item{
padding:12px;
border-radius:10px;
cursor:pointer;
margin-bottom:6px;
font-size:14px;
}

.chat-item:hover{
background:#2b2b2b;
}

.chat-item.active{
background:#343541;
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
height:60px;
display:flex;
align-items:center;
padding:0 20px;
border-bottom:1px solid #2a2a2a;
font-weight:600;
font-size:18px;
}

.chat{
flex:1;
overflow-y:auto;
padding:30px;
display:flex;
flex-direction:column;
gap:20px;
}

/* =========================
MESSAGES
========================= */

.message{
max-width:850px;
width:100%;
margin:auto;
display:flex;
}

.message.user{
justify-content:flex-end;
}

.message.assistant{
justify-content:flex-start;
}

.bubble{
padding:14px 18px;
border-radius:12px;
white-space:pre-wrap;
word-break: break-word;
line-height:1.6;
max-width:75%;
}

.user .bubble{
background:#7c3aed;
}

.assistant .bubble{
background:#2d2d2d;
white-space: pre-wrap;
word-wrap:break-word;
overflow-wrap:break-word;
max-width:100%;
}

/* =========================
INPUT
========================= */

.input-wrapper{
padding:20px;
border-top:1px solid #2a2a2a;
}

.input-box{
max-width:900px;
margin:auto;
display:flex;
gap:10px;
background:#2d2d2d;
padding:10px;
border-radius:15px;
}

.input-box input{
flex:1;
background:transparent;
border:none;
outline:none;
color:white;
font-size:15px;
}

.input-box button{
padding:10px 18px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
cursor:pointer;
}

.input-box button:hover{
background:#6d28d9;
}

.typing::after{
content:"▍";
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:0;
}
}

</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="new-chat" onclick="newChat()">
➕ New Chat
</div>

<div id="chatList" class="chat-list"></div>

</div>

<!-- MAIN -->
<div class="main">

<div class="header">
⚖ Pakistan Legal AI
</div>

<div id="chat" class="chat"></div>

<div class="input-wrapper">

<div class="input-box">

<input
id="input"
placeholder="Ask anything..."
/>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>

<script>

const API="http://localhost:8000"

let currentThreadId=null

let ws=new WebSocket("ws://localhost:8000/ws/chat")

const chat=document.getElementById("chat")
const input=document.getElementById("input")
const chatList=document.getElementById("chatList")

let currentBotBubble=null

/* =========================
MESSAGES
========================= */

function addMessage(text,role){

const row=document.createElement("div")
row.className=`message ${role}`

const bubble=document.createElement("div")
bubble.className="bubble"

bubble.textContent=text

row.appendChild(bubble)

chat.appendChild(row)

chat.scrollTop=chat.scrollHeight

return bubble
}

/* =========================
NEW CHAT
========================= */

function newChat(){

currentThreadId=null

chat.innerHTML=""

document
.querySelectorAll(".chat-item")
.forEach(x=>x.classList.remove("active"))

}

/* =========================
SEND MESSAGE
========================= */

function sendMessage(){

const text=input.value.trim()

if(!text)return

addMessage(text,"user")

input.value=""

currentBotBubble=addMessage("","assistant")
currentBotBubble.classList.add("typing")

ws.send(JSON.stringify({
message:text,
thread_id:currentThreadId
}))

}

/* =========================
STREAMING
========================= */

ws.onmessage=(event)=>{

try{

const data=JSON.parse(event.data)

if(data.type==="thread_id"){

currentThreadId=data.thread_id

loadThreads()

return

}

if(data.type==="token"){

if(currentBotBubble){

currentBotBubble.textContent+=data.content

chat.scrollTop=chat.scrollHeight

}

return

}

if(data.type==="end"){

if(currentBotBubble){

currentBotBubble.classList.remove("typing")
}

return

}

}catch{

}

}

/* =========================
LOAD SIDEBAR
========================= */

async function loadThreads(){

const res=await fetch(`${API}/threads`)

const data=await res.json()

chatList.innerHTML=""

for(const thread of data.threads){

const div=document.createElement("div")

div.className="chat-item"

if(thread.thread_id===currentThreadId){
div.classList.add("active")
}

div.textContent=thread.title

div.onclick=()=>loadThread(thread.thread_id)

chatList.appendChild(div)

}

}

/* =========================
LOAD CHAT HISTORY
========================= */

async function loadThread(threadId){

currentThreadId=threadId

const res=await fetch(
`${API}/threads/${threadId}`
)

const data=await res.json()

chat.innerHTML=""

for(const msg of data.messages){

if(msg.role==="user"){
addMessage(msg.content,"user")
}
else{
addMessage(msg.content,"assistant")
}

}

loadThreads()

}

/* =========================
ENTER
========================= */

input.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
sendMessage()
}

})

/* =========================
INITIAL LOAD
========================= */

loadThreads()

</script>

</body>
</html>
